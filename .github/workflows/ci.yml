name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: ./mvnw clean compile -B

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: healthiermo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Prepare data directory
        run: mkdir -p .data/audio-files

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/healthiermo?useSSL=false&useLegacyDatetimeCode=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: rootpassword
          SERVER_PORT: 8080
        run: ./mvnw test -B

      - name: Verify existing data survives migration
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/healthiermo_legacy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: rootpassword
          SERVER_PORT: 8080
        run: |
          container_id=$(docker ps -q --filter "ancestor=mysql:8")
          docker exec -e MYSQL_PWD=rootpassword "$container_id" mysql -u root \
            -e 'CREATE DATABASE healthiermo_legacy'
          docker exec -i -e MYSQL_PWD=rootpassword "$container_id" mysql -u root \
            healthiermo_legacy < backup/table_dump.sql
          docker exec -e MYSQL_PWD=rootpassword "$container_id" mysqldump -u root \
            --skip-comments --no-tablespaces --order-by-primary \
            healthiermo_legacy text_box > before.sql
          ./mvnw test -B -Dtest=HomepageApplicationTests
          docker exec -e MYSQL_PWD=rootpassword "$container_id" mysqldump -u root \
            --skip-comments --no-tablespaces --order-by-primary \
            healthiermo_legacy text_box > after.sql
          cmp before.sql after.sql
